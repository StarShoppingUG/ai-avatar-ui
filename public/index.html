<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Avatar UI — Web Components</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    /* Single gradient, painted once on body. .ai-avatar-shell is made
       transparent below so this shows through it uninterrupted, instead
       of each box rendering its own separately-computed gradient and
       creating a visible seam where the shell's edges are. */
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, #1e1b4b 0%, #02040a 100%);
    }

    .ai-avatar-shell {
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div class="ai-avatar-shell">
    <div class="avatar-stage">
      <avatar-model backend="https://ai-avatar-backend-xqzl.onrender.com" avatar-scale="1" avatar-vertical-offset="-1.25"></avatar-model>
      <avatar-captions></avatar-captions>
    </div>
    <avatar-status></avatar-status>
    <avatar-settings></avatar-settings>
    <avatar-inputs></avatar-inputs>
  </div>

  <script type="module" src="/ai-avatar-ui.js"></script>
</body>
</html>
