<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Avatar UI — Web Components</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    /* This demo page opts into a themed look — the library itself (index.css)
       ships with .ai-avatar-shell fully transparent by default. */
    body {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100svh;
      padding: 10px 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, #1e1b4b 0%, #02040a 100%);
    }

    .ai-avatar-shell {
      background: radial-gradient(ellipse at top, #1e1b4b 0%, #02040a 100%);
      width: 100%;
      height: 96vh;
      height: 96svh;
    }
  </style>
</head>
<body>
  <div class="ai-avatar-shell">
    <div class="avatar-stage">
      <avatar-model backend="https://ai-avatar-backend-production-15d3.up.railway.app" avatar-scale="1.2" avatar-vertical-offset="-1.25"></avatar-model>
      <avatar-captions></avatar-captions>
    </div>
    <avatar-status></avatar-status>
    <avatar-settings></avatar-settings>
    <avatar-inputs></avatar-inputs>
  </div>

  <script type="module" src="/ai-avatar-ui.js"></script>
</body>
</html>
