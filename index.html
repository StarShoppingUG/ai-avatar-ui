<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Avatar</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    .instances-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
      justify-content: center;
      padding: 12px;
      box-sizing: border-box;
      height: 100vh;
      height: 100svh;
    }
    .instance-column {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      overflow: hidden;
      padding-bottom: 8px;
    }
    .instance-label {
      color: #9fd6ff;
      font-family: system-ui, sans-serif;
      font-weight: 700;
      padding: 6px 10px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .instance-column > .ai-avatar-shell {
      margin: 0;
      width: 100%;
      height: 100%;
      flex: 1 1 auto;
      min-height: 0;
    }
  </style>
</head>

<body>
  <div class="instances-row">

    <!-- Simulates Third-Party App "acme-corp", their user "user-001" -->
    <div class="instance-column">
      <div class="instance-label">App: acme-corp — User: user-001</div>
      <avatar-setup instance="one"></avatar-setup>
      <div class="ai-avatar-shell">
        <div class="avatar-stage">
          <avatar-model
            instance="one"
            app-id="acme-corp"
            user-id="user-001"
            avatar-scale="1"
            avatar-vertical-offset="-1.25"
            backend="http://127.0.0.1:8000"
          ></avatar-model>
          <avatar-captions instance="one"></avatar-captions>
        </div>
        <avatar-status instance="one"></avatar-status>
        <avatar-settings instance="one"></avatar-settings>
        <avatar-inputs instance="one"></avatar-inputs>
      </div>
    </div>

    <!-- Simulates a DIFFERENT third-party app "globex-inc", with a user
         ID that intentionally collides with the one above ("user-001")
         to prove app-scoping actually keeps them apart. -->
    <div class="instance-column">
      <div class="instance-label">App: globex-inc — User: user-001</div>
      <avatar-setup instance="two"></avatar-setup>
      <div class="ai-avatar-shell">
        <div class="avatar-stage">
          <avatar-model
            instance="two"
            app-id="globex-inc"
            user-id="user-001"
            avatar-scale="1"
            avatar-vertical-offset="-1.25"
            backend="http://127.0.0.1:8000"
          ></avatar-model>
          <avatar-captions instance="two"></avatar-captions>
        </div>
        <avatar-status instance="two"></avatar-status>
        <avatar-settings instance="two"></avatar-settings>
        <avatar-inputs instance="two"></avatar-inputs>
      </div>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
